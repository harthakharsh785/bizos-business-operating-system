spring.application.name=bizos

# ---------- H2 (default, zero setup — good for demo/interview) ----------
spring.datasource.url=jdbc:h2:mem:bizosdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- MySQL (switch to this for production) ----------
# spring.datasource.url=jdbc:mysql://localhost:3306/bizos_db?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
bizos.jwt.secret=ThisIsADemoSecretKeyForBizOSPleaseChangeInProdEnvironment123456
bizos.jwt.expiration-ms=86400000

server.port=8080

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
